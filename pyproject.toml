[project]
name = "vc-evals"
version = "0.1.0"
description = "Checks for a VC fund's LLM output"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "nltk>=3.10.3",
    "pydantic",
    "pysbd>=0.3.4",
    "textstat>=0.7.13",
    "typer",
]

[project.scripts]
vc-evals = "vc_evals.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vc_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
